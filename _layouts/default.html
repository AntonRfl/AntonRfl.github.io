<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <style>
        /* =========================================
           1. Grund-Layout & Navigation
           ========================================= */
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        nav { border-bottom: 2px solid #ccc; padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { margin-right: 15px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .site-footer { margin-top: 50px; font-size: 0.8em; color: #666; border-top: 1px solid #ccc; padding-top: 10px; }
        
        /* =========================================
           2. Logik: Sprachen verstecken / anzeigen
           ========================================= */
        .lang-en { display: none; }
        body.show-en .lang-de { display: none; }
        body.show-en .lang-en { display: block; }

        /* =========================================
           3. Design: Pill-Toggle Schalter
           ========================================= */
        .lang-toggle {
            position: relative;
            width: 140px; 
            height: 44px;
            background-color: #2c2c2c; /* Dunkelgrauer Hintergrund */
            border-radius: 30px;
            border: 3px solid #00e676; /* Neongrüner Rand */
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            overflow: hidden; 
        }

        /* Der grüne Schieber im Hintergrund */
        .lang-toggle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: #00e676; /* Neongrün */
            border-radius: 25px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }

        /* Wenn Englisch aktiv ist, schiebt sich der Hintergrund nach rechts */
        body.show-en .lang-toggle-bg {
            transform: translateX(100%);
        }

        /* Die Beschriftung (DE / EN) */
        .lang-text {
            flex: 1;
            text-align: center;
            z-index: 2; /* Liegt ÜBER dem Schieber */
            font-weight: bold;
            font-size: 14px;
            transition: color 0.4s ease; 
        }

        /* Farben der Beschriftung (dunkel auf grün, grün auf dunkel) */
        .lang-text-de { color: #1a1a1a; } 
        .lang-text-en { color: #00e676; } 

        /* Farben wechseln, wenn der Schieber auf EN steht */
        body.show-en .lang-text-de { color: #00e676; }
        body.show-en .lang-text-en { color: #1a1a1a; }
    </style>

    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="/">Startseite</a>
            <a href="#">Über mich</a>
        </div>
        
        <div class="lang-toggle" onclick="toggleLanguage()">
            <div class="lang-toggle-bg"></div>
            <span class="lang-text lang-text-de">DE</span>
            <span class="lang-text lang-text-en">EN</span>
        </div>
    </nav>
