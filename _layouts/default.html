<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <style>
        /* =========================================
           1. Grund-Layout (Modern Deep-Space Theme)
           ========================================= */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            /* Ein schicker, dezenter Hintergrund-Farbverlauf (Tiefes Blau-Grau) */
            background: linear-gradient(135deg, #14161a 0%, #22262e 100%);
            background-attachment: fixed;
            color: #d8dee9; /* Weiches Off-White, perfekt lesbar */
            max-width: 900px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            line-height: 1.8; 
        }

        /* Überschriften & Links */
        h1, h2, h3, h4 { color: #ffffff; letter-spacing: 0.5px; }
        a { color: #00b0ff; text-decoration: none; transition: all 0.2s ease; }
        a:hover { color: #00e676; }

        /* =========================================
           2. Header / Navigation (Karten-Design mit Farbakzent)
           ========================================= */
        nav { 
            background: #1e2229; /* Etwas heller als der Hintergrund */
            padding: 20px 30px; 
            border-radius: 12px;
            margin-bottom: 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); /* Weicher 3D-Schatten */
            position: relative;
            overflow: hidden; /* Wichtig für die bunte Linie oben */
        }

        /* Der bunte Farbverlauf als Akzent-Linie am oberen Rand der Navigation */
        nav::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00e676, #00b0ff, #b388ff);
        }

        .nav-links a { 
            margin-right: 25px; 
            color: #abb2bf; 
            font-weight: 700; 
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1.5px;
        }
        .nav-links a:hover { color: #ffffff; }

        /* =========================================
           3. Content / Hauptbereich (Ebenfalls als Karte)
           ========================================= */
        main {
            background: #1e2229;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.03); /* Ganz feiner Rand für Kontrast */
        }

        /* Code-Blöcke optisch abheben */
        pre { background-color: #15181e; padding: 20px; border-radius: 8px; overflow-x: auto; border: 1px solid #2c313a; }
        code { font-family: 'Courier New', Courier, monospace; color: #98c379; }

        .site-footer { margin-top: 50px; font-size: 0.85em; color: #666; text-align: center; }
        
        /* =========================================
           4. Logik: Sprachen verstecken / anzeigen
           ========================================= */
        .lang-en { display: none; }
        body.show-en .lang-de { display: none; }
        body.show-en .lang-en { display: block; }

        /* =========================================
           5. Design: Dein originaler Toggle-Button!
           ========================================= */
        .lang-toggle {
            position: relative;
            width: 160px; 
            height: 48px;
            background-color: #2b2b2b;
            border-radius: 30px;
            border: 3px solid #00e676;
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.2); /* Ein leichter grüner Glow für den Button */
        }

        .lang-toggle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: #00e676;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }

        body.show-en .lang-toggle-bg { transform: translateX(100%); }

        .lang-text {
            flex: 1;
            text-align: center;
            z-index: 2;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: color 0.3s ease; 
        }

        .lang-text-de { color: #2b2b2b; }
        .lang-text-en { color: #00e676; }

        body.show-en .lang-text-de { color: #00e676; }
        body.show-en .lang-text-en { color: #2b2b2b; }
    </style>

    {% raw %}
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
      };
    </script>
    {% endraw %}
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="/">Startseite</a>
            <a href="/software-engineering/">Software Engineering</a>
            <a href="/it-security/">IT Security</a>
            <a href="/data-science/">Data Science</a>
        </div>
        
        <div class="lang-toggle" onclick="toggleLanguage()">
            <div class="lang-toggle-bg"></div>
            <span class="lang-text lang-text-de">DE</span>
            <span class="lang-text lang-text-en">EN</span>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 AntonRfl. Erstellt mit eigenem HTML & Jekyll.</p>
    </footer>

    <script>
        function toggleLanguage() {
            document.body.classList.toggle('show-en');
            if (document.body.classList.contains('show-en')) {
                localStorage.setItem('preferredLang', 'en');
            } else {
                localStorage.setItem('preferredLang', 'de');
            }
        }
        if (localStorage.getItem('preferredLang') === 'en') {
            document.body.classList.add('show-en');
        }
    </script>

</body>
</html>
