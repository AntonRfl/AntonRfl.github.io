<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <style>
        /* =========================================
           1. Grund-Layout (Tiefer Hintergrund)
           ========================================= */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            /* Hier liegt nur noch der saubere, dunkle Farbverlauf */
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            background-attachment: fixed;
            color: #e6edf3; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 30px 20px; 
            line-height: 1.8; 
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            z-index: -1; 
            pointer-events: none; 
            
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            
            /* NEU: Die Maske, die das Gitter nach außen hin weich ausblendet */
            -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
            mask-image: radial-gradient(ellipse at center, black 0%, transparent 80%);
        }

        /* Überschriften & Links */
        h1, h2, h3, h4 { color: #ffffff; letter-spacing: 0.5px; }
        a { color: #00b0ff; text-decoration: none; transition: all 0.2s ease; }
        a:hover { color: #00e676; }

        /* =========================================
           2. Header / Navigation (Hellere Karten)
           ========================================= */
        nav { 
            background: #21262d; /* Deutlich heller als der Hintergrund (Schiefergrau) */
            padding: 20px 30px; 
            border-radius: 12px;
            margin-bottom: 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); /* Kräftigerer Schatten für 3D-Effekt */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Feine helle Kante zur Abgrenzung */
            position: relative;
            overflow: hidden;
        }

        /* Der bunte, ANIMIERTE Farbverlauf am oberen Rand */
        nav::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            /* Der Verlauf wird wiederholt, damit die Schleife nahtlos ist */
            background: linear-gradient(90deg, #00e676, #00b0ff, #b388ff, #00e676);
            background-size: 300% 100%; /* Den Hintergrund künstlich in die Breite ziehen */
            animation: gradientMove 6s linear infinite; /* 6 Sekunden Dauer, Endlosschleife */
        }

        /* Die Anleitung für die Bewegung */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .nav-links a { 
            margin-right: 25px; 
            color: #abb2bf; 
            font-weight: 700; 
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1.5px;
        }
        .nav-links a:hover { color: #ffffff; }

        /* =========================================
           3. Content / Hauptbereich (Ebenfalls heller)
           ========================================= */
        main {
            background-color: #21262d; 
            
            /* NEU: Echtes Karomuster (Gitter) in einer helleren Farbe */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
            background-size: 24px 24px; /* Die Größe der Quadrate */
            
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        /* Code-Blöcke optisch abheben (wieder etwas dunkler für Kontrast) */
        pre { background-color: #0d1117; padding: 20px; border-radius: 8px; overflow-x: auto; border: 1px solid #30363d; }
        code { font-family: 'Courier New', Courier, monospace; color: #7ee787; }

        /* =========================================
           Footer & Social Links
           ========================================= */
        .site-footer { 
            margin-top: 60px; 
            font-size: 0.9em; 
            color: #8b949e; 
            text-align: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.05); /* Zarte Trennlinie */
            padding-top: 30px; 
        }
        .social-links { 
            display: flex; 
            justify-content: center; 
            gap: 25px; /* Abstand zwischen den Links */
            margin-bottom: 20px; 
        }
        .social-links a { 
            color: #8b949e; 
            display: flex; 
            align-items: center; 
            gap: 8px; /* Abstand zwischen Icon und Text */
            transition: color 0.3s ease; 
        }
        .social-links a:hover { 
            color: #00e676; /* Neongrüner Hover-Effekt */
        }
        .social-links svg { 
            width: 22px; 
            height: 22px; 
            fill: currentColor; /* Übernimmt automatisch die Textfarbe */
        }
        
        /* =========================================
           4. Logik: Sprachen verstecken / anzeigen
           ========================================= */
        .lang-en { display: none; }
        body.show-en .lang-de { display: none; }
        body.show-en .lang-en { display: block; }

        /* =========================================
           5. Design: Toggle-Button (Unverändert)
           ========================================= */
        .lang-toggle {
            position: relative;
            width: 160px; 
            height: 48px;
            background-color: #2b2b2b;
            border-radius: 30px;
            border: 3px solid #00e676;
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.2); 
        }

        .lang-toggle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: #00e676;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }

        body.show-en .lang-toggle-bg { transform: translateX(100%); }

        .lang-text {
            flex: 1;
            text-align: center;
            z-index: 2;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: color 0.3s ease; 
        }

        .lang-text-de { color: #2b2b2b; }
        .lang-text-en { color: #00e676; }

        body.show-en .lang-text-de { color: #00e676; }
        body.show-en .lang-text-en { color: #2b2b2b; }
    
        /* =========================================
           Spotlight Cursor-Glow
            ========================================= */
        .cursor-glow {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; 
            z-index: 9999; 
            background: radial-gradient(
                800px circle at var(--mouse-x, 50vw) var(--mouse-y, 50vh), 
                rgba(0, 230, 118, 0.25) 0%,   
                rgba(0, 230, 118, 0.05) 30%,  
                transparent 60%               
            );
        }
    
    </style>

    {% raw %}
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
      };
    </script>
    {% endraw %}
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<div class="cursor-glow"></div>
    <nav>
        <div class="nav-links">
            <a href="/">Startseite</a>
            <a href="/software-engineering/">Software Engineering</a>
            <a href="/it-security/">IT Security</a>
            <a href="/data-science/">Data Science</a>
        </div>
        
        <div class="lang-toggle" onclick="toggleLanguage()">
            <div class="lang-toggle-bg"></div>
            <span class="lang-text lang-text-de">DE</span>
            <span class="lang-text lang-text-en">EN</span>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <div class="social-links">
            <a href="https://github.com/AntonRfl" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 16 16">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                GitHub
            </a>
            
            <a href="https://www.linkedin.com/in/anton-rofail" target="_blank" rel="noopener noreferrer">

                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>

        </div>
        <p>&copy; 2026 AntonRfl. Erstellt mit HTML & Jekyll.</p>
    </footer>

    <script>
        function toggleLanguage() {
            document.body.classList.toggle('show-en');
            if (document.body.classList.contains('show-en')) {
                localStorage.setItem('preferredLang', 'en');
            } else {
                localStorage.setItem('preferredLang', 'de');
            }
        }
        if (localStorage.getItem('preferredLang') === 'en') {
            document.body.classList.add('show-en');
        }
    
    // Den Cursor-Glow an die Maus heften
        document.addEventListener('mousemove', function(e) {
            const glow = document.querySelector('.cursor-glow');
            if (glow) {
                // Gibt die exakten X und Y Koordinaten der Maus an das CSS weiter
                glow.style.setProperty('--mouse-x', e.clientX + 'px');
                glow.style.setProperty('--mouse-y', e.clientY + 'px');
            }
        });
    
    </script>

</body>
</html>
