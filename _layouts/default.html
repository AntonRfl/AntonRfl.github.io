<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <style>
        /* =========================================
           1. Grund-Layout (Modern Deep-Gradient)
           ========================================= */
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            /* Ein tiefer, bläulich-grauer Farbverlauf als Hintergrund */
            background: linear-gradient(135deg, #0f1115 0%, #1e222b 100%);
            background-attachment: fixed; /* Hintergrund bleibt beim Scrollen stehen */
            color: #d1d5db; /* Angenehmes, weiches Hellgrau für den Text */
            max-width: 900px; 
            margin: 0 auto; 
            padding: 20px; 
            line-height: 1.8; 
        }

        /* Der Textbereich als schicke, abgesetzte Karte */
        main {
            background-color: rgba(30, 33, 40, 0.7); /* Leicht durchsichtig */
            backdrop-filter: blur(10px); /* Milchglas-Effekt */
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 30px;
        }

        /* Überschriften stylen */
        h1, h2, h3, h4 { color: #f3f4f6; font-weight: 700; }
        
        /* Die Hauptüberschrift bekommt einen Farbverlauf */
        h1 {
            background: linear-gradient(90deg, #00e676, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        a { color: #00e5ff; text-decoration: none; transition: all 0.2s ease-in-out; }
        a:hover { color: #00e676; text-shadow: 0 0 8px rgba(0, 230, 118, 0.4); }

        /* =========================================
           2. Stylische Navigation (Header)
           ========================================= */
        nav { 
            background: linear-gradient(90deg, rgba(25, 28, 35, 0.9) 0%, rgba(15, 17, 21, 0.9) 100%);
            backdrop-filter: blur(10px);
            padding: 20px 30px; 
            border-radius: 16px;
            margin-top: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border-bottom: 3px solid #00e676; /* Der neongrüne Akzentstreifen */
        }
        .nav-links a { 
            margin-right: 25px; 
            color: #9ca3af; 
            font-weight: 600; 
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .nav-links a:hover { color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }

        /* =========================================
           3. Code-Blöcke & Footer
           ========================================= */
        pre { 
            background-color: #0d0f12; 
            padding: 20px; 
            border-radius: 10px; 
            overflow-x: auto; 
            border: 1px solid #2d3139; 
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        code { font-family: 'Fira Code', 'Courier New', Courier, monospace; color: #69f0ae; }

        .site-footer { margin-top: 60px; font-size: 0.85em; color: #6b7280; text-align: center; padding-bottom: 20px;}
        
        /* =========================================
           4. Logik: Sprachen verstecken / anzeigen
           ========================================= */
        .lang-en { display: none; }
        body.show-en .lang-de { display: none; }
        body.show-en .lang-en { display: block; }

        /* =========================================
           5. Dein Button (Unverändert übernommen)
           ========================================= */
        .lang-toggle {
            position: relative;
            width: 160px; 
            height: 48px;
            background-color: #2b2b2b;
            border-radius: 30px;
            border: 3px solid #00e676;
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            overflow: hidden; 
        }

        .lang-toggle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: #00e676;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 1;
        }

        body.show-en .lang-toggle-bg { transform: translateX(100%); }

        .lang-text {
            flex: 1;
            text-align: center;
            z-index: 2;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: color 0.3s ease; 
        }

        .lang-text-de { color: #111; } 
        .lang-text-en { color: #00e676; } 

        body.show-en .lang-text-de { color: #00e676; }
        body.show-en .lang-text-en { color: #111; }
    </style>

    {% raw %}
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
      };
    </script>
    {% endraw %}
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="/">Startseite</a>
            <a href="/software-engineering/">Software Engineering</a>
            <a href="/it-security/">IT Security</a>
            <a href="/data-science/">Data Science</a>
        </div>
        
        <div class="lang-toggle" onclick="toggleLanguage()">
            <div class="lang-toggle-bg"></div>
            <span class="lang-text lang-text-de">DE</span>
            <span class="lang-text lang-text-en">EN</span>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 AntonRfl. Erstellt mit eigenem HTML & Jekyll.</p>
    </footer>

    <script>
        function toggleLanguage() {
            document.body.classList.toggle('show-en');
            if (document.body.classList.contains('show-en')) {
                localStorage.setItem('preferredLang', 'en');
            } else {
                localStorage.setItem('preferredLang', 'de');
            }
        }
        if (localStorage.getItem('preferredLang') === 'en') {
            document.body.classList.add('show-en');
        }
    </script>

</body>
</html>
