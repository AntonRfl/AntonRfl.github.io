<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        nav { border-bottom: 2px solid #ccc; padding-bottom: 15px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { margin-right: 15px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .site-footer { margin-top: 50px; font-size: 0.8em; color: #666; border-top: 1px solid #ccc; padding-top: 10px; }
        
        .lang-en { display: none; }
        body.show-en .lang-de { display: none; }
        body.show-en .lang-en { display: block; }

        /* iOS-Style Toggle */
        .ios-toggle {
            position: relative;
            width: 90px;
            height: 40px;
            background-color: #d8d8d8;
            border-radius: 40px;
            border: 2px solid #5a5f73;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: background-color 0.3s;
            box-sizing: border-box;
        }

        .ios-toggle::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 3px;
            width: 32px;
            height: 32px;
            background-color: #ffffff;
            border-radius: 50%;
            border: 1px solid #5a5f73;
            box-sizing: border-box;
            transition: transform 0.3s;
        }

        .ios-toggle::before {
            content: 'DE';
            position: absolute;
            right: 15px;
            font-weight: bold;
            font-size: 16px;
            color: #0b1426;
        }

        body.show-en .ios-toggle {
            background-color: #b7efc5;
        }
        body.show-en .ios-toggle::after {
            transform: translateX(48px);
        }
        body.show-en .ios-toggle::before {
            content: 'EN';
            left: 15px;
            right: auto;
        }
    </style>

    {% raw %}
    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
      };
    </script>
    {% endraw %}
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="/">Startseite</a>
            <a href="/software-engineering/">Software Engineering</a>
            <a href="/it-security/">IT Security</a>
            <a href="/data-science/">Data Science</a>
            <a href="#">Über mich</a>
        </div>
        
        <div class="ios-toggle" onclick="toggleLanguage()"></div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 AntonRfl. Erstellt mit eigenem HTML & Jekyll.</p>
    </footer>

    <script>
        function toggleLanguage() {
            document.body.classList.toggle('show-en');
            if (document.body.classList.contains('show-en')) {
                localStorage.setItem('preferredLang', 'en');
            } else {
                localStorage.setItem('preferredLang', 'de');
            }
        }
        if (localStorage.getItem('preferredLang') === 'en') {
            document.body.classList.add('show-en');
        }
    </script>

</body>
</html>
