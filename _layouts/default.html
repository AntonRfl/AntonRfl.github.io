<style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        nav { border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { margin-right: 15px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .site-footer { margin-top: 50px; font-size: 0.8em; color: #666; border-top: 1px solid #ccc; padding-top: 10px; }
        
        /* Sprach-Text Standardmäßig verstecken */
        .lang-en { display: none; }
        body.show-en .lang-de { display: none; }
        body.show-en .lang-en { display: block; }

        /* =========================================
           NEUES DESIGN: Pill-Toggle Schalter
           ========================================= */
        .lang-toggle {
            position: relative;
            width: 140px; /* Etwas breiter für den Text */
            height: 46px;
            background-color: #2c2c2c; /* Dunkelgrauer Hintergrund wie im Bild */
            border-radius: 30px;
            border: 3px solid #00e676; /* Neongrüner Rand */
            display: flex;
            align-items: center;
            cursor: pointer;
            user-select: none;
            overflow: hidden; /* Hält den Schieber im Rahmen */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* Leichter Schatten für Tiefe */
        }

        /* Der grüne Schieber im Hintergrund */
        .lang-toggle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background-color: #00e676; /* Das Neongrün */
            border-radius: 25px;
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); /* Weiche, fließende Animation */
            z-index: 1;
        }

        /* Wenn Englisch aktiv ist, schiebt sich der Hintergrund nach rechts */
        body.show-en .lang-toggle-bg {
            transform: translateX(100%);
        }

        /* Die Beschriftung (DE / EN) */
        .lang-text {
            flex: 1;
            text-align: center;
            z-index: 2; /* Liegt ÜBER dem Schieber */
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: color 0.4s ease; /* Weicher Farbwechsel */
        }

        /* Farben der Beschriftung anpassen (dunkel auf grün, grün auf dunkel) */
        .lang-text-de { color: #1a1a1a; } /* Dunkler Text auf dem grünen Schieber (Standard: DE) */
        .lang-text-en { color: #00e676; } /* Grüner Text auf dem dunklen Hintergrund (Standard: EN) */

        /* Beschriftungs-Farben wechseln, wenn der Schieber auf EN steht */
        body.show-en .lang-text-de { color: #00e676; } /* DE wird grün */
        body.show-en .lang-text-en { color: #1a1a1a; } /* EN wird dunkel */
    </style>
