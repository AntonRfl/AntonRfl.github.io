<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        nav { border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { margin-right: 15px; color: #0056b3; text-decoration: none; font-weight: bold; }
        .site-footer { margin-top: 50px; font-size: 0.8em; color: #666; border-top: 1px solid #ccc; padding-top: 10px; }
        
        /* Sprach-Schalter Button Design */
        #lang-toggle { cursor: pointer; padding: 5px 10px; background: #eee; border: 1px solid #ccc; border-radius: 5px; font-weight: bold;}
        
        /* Standardmäßig Englisch verstecken */
        .lang-en { display: none; }
        /* Wenn der Body die Klasse 'show-en' hat, Deutsch verstecken und Englisch zeigen */
        body.show-en .lang-de { display: none; }
        body.show-en .lang-en { display: block; }
    </style>

    <script>
      MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

    <nav>
        <div class="nav-links">
            <a href="/">Startseite</a>
            <a href="#">Über mich</a>
        </div>
        <button id="lang-toggle" onclick="toggleLanguage()">🌐 DE / EN</button>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 AntonRfl. Erstellt mit eigenem HTML & Jekyll.</p>
    </footer>

    <script>
        function toggleLanguage() {
            // Body-Klasse umschalten
            document.body.classList.toggle('show-en');
            // Die Wahl des Nutzers im Browser speichern, damit sie beim nächsten Klick erhalten bleibt
            if (document.body.classList.contains('show-en')) {
                localStorage.setItem('preferredLang', 'en');
            } else {
                localStorage.setItem('preferredLang', 'de');
            }
        }

        // Beim Laden der Seite prüfen, ob der Nutzer vorher schon EN gewählt hat
        if (localStorage.getItem('preferredLang') === 'en') {
            document.body.classList.add('show-en');
        }
    </script>
</body>
</html>
